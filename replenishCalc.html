<!DOCTYPE html>
<html>

<head>
    <!-- This is here for better mobile touch detection. However this was disabled in the JS. Look there for reason -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Replenishment Calculator</title>
    <!-- Link to local CSS -->
    <link href="./css/app.css" rel="stylesheet">
    <link href="./css/replenishCalc.css" rel="stylesheet">
    <!-- Link to JsBarcode library -->
    <script src="./js/JsBarcode.all.min.js"></script>
    <script src="./js/replenishCalc.js"></script>
</head>

<nav>
    <a class="navigation" href="index.html">UPC-A Generator</a>
</nav>

<body>

    <div class="container text-center py-5">

        <h2 class="mb-4 display-6">Enter in the length of the replenishment list</h2>

        <span id="digitCountMessage">0 list entered.</span>
        <span id="totalCount">0 items counted.</span>
        <span id="listArray"></span>

        <h3 id="currentNumber">0</h3>

        <br>

        <div class="numPadArea">
            <div class="numPad">
                <button class="numPadNum">1</button>
                <button class="numPadNum">2</button>
                <button class="numPadNum">3</button>
                <button class="numPadNum">4</button>
                <button class="numPadNum">5</button>
                <button class="numPadNum">6</button>
                <button class="numPadNum">7</button>
                <button class="numPadNum">8</button>
                <button class="numPadNum">9</button>
                <button class="numPadNum">0</button>
            </div>
            <div class="actionPad">
                <button data-action="clear" class="numPadAction">
                    #
                </button>
                <br>
                <button data-action="undo" class="numPadAction">
                    &lt;
                </button>
                <br>
                <button data-action="addList" class="numPadAction">
                    +
                </button>
            </div>
        </div>

    </div>

</body>

</html>
